  .step li{margin:4px 0}
  .box{border-radius:14px;padding:14px 16px;margin:12px 0;font-size:.95em}

  .box.danger{background:#fde8ec;border:2px solid var(--danger)}

  table{width:100%;border-collapse:collapse;font-size:.95em;margin:8px 0 14px;background:#fff}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function steps(list){
  return list.map((s,i)=>`
    <div class="step">
      <div class="num" aria-hidden="true">${i+1}</div>
      <div class="body">
        <h4>${esc(s.t)}</h4>
        ${s.d ? `<div>${s.d}</div>` : ""}
        ${s.b ? `<ul>${s.b.map(x=>`<li>${x}</li>`).join("")}</ul>` : ""}
      </div>
    </div>`).join("");
}
function box(type, title, body){
  return `<div class="box ${type}"><b>${esc(title)}</b>${body}</div>`;
}
const warn = (t,b)=>box("danger","⚠ "+t,b);
const note = (t,b)=>box("warn","📌 "+t,b);
const tip  = (t,b)=>box("info","💡 "+t,b);
const ok   = (t,b)=>box("ok","✔ "+t,b);

/* ---------- 路由與畫面 ---------- */
const $ = id => document.getElementById(id);
function renderHome(){
  $("tiles").innerHTML = SECTIONS.map(s=>`
    <button class="tile" data-go="${s.id}">
      <span class="no">第 ${s.no} 章・說明書 ${s.ref}</span>
      <span class="t">${esc(s.title)}</span>
      <span class="d">${esc(s.desc)}</span>
    </button>`).join("");
}
function showHome(){
  $("home").classList.remove("hidden");
  $("page").classList.add("hidden");
  $("backBtn").hidden = true;
  $("title").textContent = "東芝蒸烘烤料理爐 互動手冊";
  history.replaceState(null,"","#");
  window.scrollTo(0,0);
}
function openPage(id){
  let html = "", title = "";
  if (id.startsWith("manual:")) {
    const sub = id.split(":")[1];
    html = manualDetail(sub);
    title = (window.__manualList||[]).find(x=>x.id===sub)?.t || "手動烹調";
    html = `<div class="crumb"><a href="#manual" style="color:var(--brand-dark)">手動烹調</a> › ${esc(title)}</div>` + html;
  } else {
    const s = SECTIONS.find(x=>x.id===id);
    if (!s) return showHome();
    title = s.title;
    html = `<div class="crumb">第 ${s.no} 章・說明書 ${s.ref}</div><h2 class="page">${esc(s.title)}</h2>` + s.render();
  }
  $("home").classList.add("hidden");
  $("page").innerHTML = html;
  $("page").classList.remove("hidden");
  $("backBtn").hidden = false;
  $("title").textContent = title;
  window.scrollTo(0,0);
}
function route(){
  const h = location.hash.replace("#","");
  if (!h) return showHome();
  if (h === "manual") return openPage("manual");
  if (h.startsWith("manual:")) return openPage(h);
  openPage(h);
}

document.addEventListener("click", e=>{
  const go = e.target.closest("[data-go]");
  if (go) { location.hash = go.dataset.go; return; }
  const fs = e.target.closest("[data-fs]");
  if (fs) {
    document.body.classList.remove("big","xl");
    if (fs.dataset.fs) document.body.classList.add(fs.dataset.fs);
    document.querySelectorAll("[data-fs]").forEach(b=>b.classList.toggle("on", b===fs));
    try { localStorage.setItem("toshiba-fs", fs.dataset.fs); } catch(_) {}
  }
});
$("backBtn").addEventListener("click", ()=>{ location.hash = ""; });
window.addEventListener("hashchange", route);

/* 搜尋 */
const SEARCH_INDEX = [];
function buildIndex(){
  SECTIONS.forEach(s=>{
    const tmp = document.createElement("div");
    tmp.innerHTML = s.render();
    SEARCH_INDEX.push({ id:s.id, title:s.title, text:tmp.textContent.replace(/\s+/g," ") });
  });
}
$("q").addEventListener("input", e=>{
  const kw = e.target.value.trim();
  const box = $("searchResults");
  if (!kw) { box.classList.add("hidden"); box.innerHTML=""; $("tiles").classList.remove("hidden"); return; }
  const hits = SEARCH_INDEX.filter(x => (x.title+" "+x.text).toLowerCase().includes(kw.toLowerCase()));
  $("tiles").classList.add("hidden");
  box.classList.remove("hidden");
  box.innerHTML = hits.length
    ? `<div class="grid">${hits.map(h=>`<button class="tile" data-go="${h.id}"><span class="t">${esc(h.title)}</span><span class="d">搜尋結果</span></button>`).join("")}</div>`
    : `<p class="card">找不到「${esc(kw)}」，請試試其他字詞，或直接查看各章節。</p>`;
});

/* 初始化 */
(function init(){
  try {
    const saved = localStorage.getItem("toshiba-fs") || "";
    if (saved) document.body.classList.add(saved);
    document.querySelectorAll("[data-fs]").forEach(b=>b.classList.toggle("on", b.dataset.fs === saved));
  } catch(_) {}
  renderHome();
  buildIndex();
  route();
})();
</script>
